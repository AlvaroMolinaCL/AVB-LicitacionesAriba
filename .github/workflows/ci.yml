name: Pruebas Automatizadas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -p "test_*.py" -v

  compilar-ejecutable:
    name: Verificar compilación de Licitaciones_Codelco.exe
    runs-on: windows-latest
    needs: pruebas

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.16,<7"

      - name: Compilar Licitaciones_Codelco.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name Licitaciones_Codelco --distpath . --workpath .datos/pyinstaller-produccion-trabajo --specpath .datos/pyinstaller-config --hidden-import keyring.backends.Windows --collect-all playwright principal.py

      - name: Subir ejecutable como artefacto (opcional, disponible 7 días)
        uses: actions/upload-artifact@v4
        with:
          name: Licitaciones_Codelco-Windows
          path: Licitaciones_Codelco.exe
          retention-days: 7
