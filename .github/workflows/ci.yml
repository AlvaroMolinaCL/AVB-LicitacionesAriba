name: Pruebas Automatizadas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=7,<10"

      - name: Cachear navegadores de Playwright
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: .datos/navegadores
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium para pruebas de navegación
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.datos\navegadores
        run: python -m playwright install chromium

      - name: Ejecutar pruebas unitarias
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.datos\navegadores
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest -v

  compilar-ejecutable:
    name: Verificar compilación de Licitaciones_Codelco.exe
    runs-on: windows-latest
    needs: pruebas

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.16,<7"

      - name: Compilar Licitaciones_Codelco.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name Licitaciones_Codelco --distpath . --workpath .datos/pyinstaller-produccion-trabajo --specpath .datos/pyinstaller-config --hidden-import keyring.backends.Windows --collect-all playwright principal.py

      - name: Subir ejecutable como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: Licitaciones_Codelco-Windows
          path: Licitaciones_Codelco.exe
          retention-days: 7
